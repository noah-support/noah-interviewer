[project]
name = "noah-interviewee-harness"
version = "0.1.0"
description = "AI interviewee testing harness for BPMN reconstruction evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "elevenlabs>=1.0.0",
    "livekit>=1.0.0",
    "livekit-api>=1.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["interviewees*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
