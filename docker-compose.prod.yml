# Optional full-stack reference for staging. Production on Northflank uses managed addons
# and separate services — see docs/DEPLOYMENT.md.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Newpassword
      POSTGRES_DB: noah
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.local
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CLEAN_DATABASE_ON_EXIT: "false"
    depends_on:
      - db
      - redis

  agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "interviewer.py", "start"]
    env_file:
      - ./backend/.env.local
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CLEAN_DATABASE_ON_EXIT: "false"
    depends_on:
      - db
      - redis

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "celery_app.celery_app", "worker", "-l", "info"]
    env_file:
      - ./backend/.env.local
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_LIVEKIT_URL: ws://localhost:7880
        NEXT_PUBLIC_SHOW_SYSTEM_MANAGER: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
