services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Newpassword
      POSTGRES_DB: noah
    ports:
      - "5434:5432"
    volumes:
      - postgres-data-2:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data-2:

